# The releases site (releases.devoltz.party): two containers on the network of the Doctor's site (devo-site), so its
# Cloudflare tunnel serves this site too under one more public hostname; no port published on the host.
#   releases-site   nginx, read-only, serving /opt/releases-site/www/current (no access log)
#   releases-sync   puts each new site in place (sync.py: GitHub's public API, sha256 checked)
# The map files are NOT here: they are served by Cloudflare R2 (dl.devoltz.party). See README.md.
name: releases-site

services:
  site:
    image: nginx:1.31-alpine
    container_name: releases-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - /opt/releases-site/www:/srv/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./headers.conf:/etc/nginx/snippets/devo_headers.conf:ro
    networks: [devo]

  sync:
    image: python:3.14-alpine
    container_name: releases-sync
    restart: unless-stopped
    read_only: true
    user: "10101:10101"
    environment:
      REPOSITORY: devoltzz/devoltz-releases
      WWW: /srv/www
      INTERVAL: "900"
      KEEP: "3"
    volumes:
      - /opt/releases-site/www:/srv/www
      - ./sync.py:/app/sync.py:ro
    command: ["python", "-u", "/app/sync.py"]
    networks: [devo]

networks:
  devo:
    name: devo-site
    external: true
